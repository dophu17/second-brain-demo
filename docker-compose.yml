version: '3.8'

services:
  second-brain-app:
    build: .
    container_name: second_brain_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/app/vault
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=hermes3
      - VAULT_PATH=/app/vault
      - LOG_LEVEL=INFO
    extra_hosts:
      - "host.docker.internal:host-gateway"
